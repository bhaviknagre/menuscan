<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D3A">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   COLOURS
   --brand / --accent can be changed per restaurant with  theme: {...}
   in menus/<id>.js (see menus/_template.js). Everything else follows.
   ===================================================================== */
:root{
  --brand:#2F5D3A;          /* main restaurant colour (header, buttons) */
  --brand-dark:#8CCB98;     /* the same colour, lighter, for dark mode */
  --accent:#E3A21A;         /* highlight colour (table badge, chef's pick) */
  --font-head:"Yatra One","Mukta",serif;

  --bg:#FAF6EF; --surface:#FFFFFF; --ink:#2A2118; --muted:#6B6053; --line:#ECE3D6; --chip:#F3ECE2;
  --leaf:var(--brand); --on-leaf:#FFFFFF; --turmeric:var(--accent);
  --veg:#1E8E3E; --nonveg:#B3261E; --wa:#0F7F43;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 6px 20px rgba(60,40,20,.07);
  --shadow-lg:0 12px 40px rgba(30,20,10,.22);
  --r:16px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15120E; --surface:#201B16; --ink:#F3ECE2; --muted:#B5A897; --line:#352D24; --chip:#2B241D;
    --leaf:var(--brand-dark); --on-leaf:#15120E; --veg:#4CC26A; --nonveg:#F2766D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120E; --surface:#201B16; --ink:#F3ECE2; --muted:#B5A897; --line:#352D24; --chip:#2B241D;
  --leaf:var(--brand-dark); --on-leaf:#15120E; --veg:#4CC26A; --nonveg:#F2766D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}

/* ----- Base ----- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 140px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:currentColor}

/* ----- Header / hero ----- */
.hero{position:relative;color:#fff;overflow:hidden;background:linear-gradient(160deg,var(--brand),color-mix(in srgb,var(--brand) 62%,#000))}
.hero .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.has-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.2) 40%,rgba(0,0,0,.72) 100%)}
.hero-in{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px 16px 24px;min-height:176px;display:flex;flex-direction:column}
.hero.has-cover .hero-in{min-height:248px}
.hero-top{display:flex;align-items:center;gap:8px}
.hero-top .grow{flex:1}
.logo{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.pill{min-height:44px;border-radius:999px;padding:6px 16px;font-weight:700;font-size:.92rem;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.2);color:#fff;cursor:pointer;backdrop-filter:blur(6px)}
.tbl{background:var(--turmeric);color:#2A2118;font-weight:800;border-radius:999px;padding:6px 14px;font-size:.92rem;white-space:nowrap}
.brand{font-family:var(--font-head);font-weight:400;font-size:clamp(2.1rem,9vw,3rem);line-height:1.05;margin:auto 0 4px;padding-top:24px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.tagline{margin:0;opacity:.95;font-size:1rem;text-shadow:0 1px 6px rgba(0,0,0,.3)}

/* ----- Sticky search, veg switch and category chips ----- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -16px;padding:12px 16px 8px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:0 14px 0 42px;font:inherit;font-size:1rem;box-shadow:var(--shadow)}
.vegsw{display:flex;align-items:center;gap:8px;height:48px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.95rem;box-shadow:var(--shadow)}
.track{width:36px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.vegsw[aria-checked="true"] .track{background:var(--veg)}
.vegsw[aria-checked="true"] .thumb{transform:translateX(14px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}

/* ----- Dish cards ----- */
section{scroll-margin-top:calc(var(--toolbarH,120px) + 8px)}
section h2{font-family:var(--font-head);font-weight:400;font-size:1.6rem;color:var(--leaf);margin:32px 0 12px;display:flex;align-items:baseline;gap:8px}
section h2 .cnt{font-family:"Mukta",sans-serif;font-size:.9rem;color:var(--muted);font-weight:600}
.dish{display:flex;gap:16px;padding:16px;margin-bottom:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer}
.info{flex:1;min-width:0}
.marks{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.mark{width:16px;height:16px;border:2px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.mark::after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.mark.nv::after{border-radius:0;width:0;height:0;background:none;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:8px solid currentColor}
.veg{color:var(--veg)}.nv{color:var(--nonveg)}
.tag{font-size:.78rem;font-weight:700;border-radius:6px;padding:1px 8px;line-height:1.6}
.tag.chef{background:color-mix(in srgb,var(--turmeric) 24%,var(--surface));color:var(--ink)}
.tag.spicy{background:color-mix(in srgb,var(--nonveg) 13%,var(--surface));color:var(--nonveg)}
.tag.bestseller{background:color-mix(in srgb,var(--leaf) 14%,var(--surface));color:var(--leaf)}
.dname{margin:0;font-size:1.08rem;line-height:1.3}
.dname button{all:unset;cursor:pointer;font-weight:700}
.dname button:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;border-radius:4px}
.alt{color:var(--muted);font-size:.9rem}
.price{font-weight:700;margin-top:4px}
.desc{color:var(--muted);font-size:.92rem;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{-webkit-line-clamp:unset}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;color:var(--leaf);background:var(--chip);border-radius:6px;padding:1px 8px;margin-top:8px}
.media{position:relative;flex:none;width:112px;align-self:flex-start;padding-bottom:20px}
.media img{display:block;width:112px;height:112px;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--chip)}
.media .ctl{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
.dish.noimg .media{width:auto;align-self:flex-end;padding:0}
.dish.noimg .media .ctl{position:static;transform:none}
.add{min-width:100px;height:44px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--leaf) 45%,var(--line));background:var(--surface);color:var(--leaf);font-weight:800;letter-spacing:.04em;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.qty{display:flex;align-items:center;justify-content:space-between;min-width:100px;height:44px;border-radius:12px;background:var(--leaf);color:var(--on-leaf);box-shadow:0 3px 10px rgba(0,0,0,.15);overflow:hidden}
.qty button{width:36px;height:44px;border:0;background:transparent;color:inherit;font-size:1.25rem;font-weight:800;cursor:pointer}
.qty span{min-width:24px;text-align:center;font-weight:800}
.qty.sm{min-width:96px}
.na{font-size:.85rem;font-weight:700;color:var(--nonveg);white-space:nowrap}
.dish.off .info{opacity:.6}
.dish.off .media img{filter:grayscale(1);opacity:.5}
.empty{padding:48px 0;color:var(--muted);text-align:center}
footer{color:var(--muted);font-size:.85rem;text-align:center;margin-top:40px}
.pop{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.media .ctl.pop{animation:popc .32s ease-out}
@keyframes popc{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.14)}100%{transform:translateX(-50%) scale(1)}}

/* ----- Skeleton while the menu loads ----- */
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--chip) 25%,color-mix(in srgb,var(--chip) 50%,var(--surface)) 50%,var(--chip) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.sk-dish{display:flex;gap:16px;padding:16px;margin-bottom:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:10px;padding-top:4px}
.hero .sk{background:rgba(255,255,255,.25);animation:none}

/* ----- Floating bottom bar ----- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar button{pointer-events:auto;width:100%;max-width:688px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:64px;border:0;border-radius:18px;padding:8px 8px 8px 12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);cursor:pointer;text-align:left;animation:up .28s ease-out}
.bar .count{display:grid;place-items:center;min-width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--bg) 16%,transparent);font-weight:800}
.bar .bt{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.bar .bt b{font-size:1rem}.bar .bt small{opacity:.85;font-size:.9rem}
.bar .go{display:flex;align-items:center;gap:8px;min-height:48px;border-radius:14px;padding:0 16px;font-weight:800;background:var(--wa);color:#fff;white-space:nowrap}
.bar .go.view{background:var(--bg);color:var(--ink)}
.bar .bump{animation:pop .32s ease-out}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--wa);color:#fff;box-shadow:var(--shadow-lg);z-index:9;transition:bottom .25s ease}
.fab svg{width:28px;height:28px}
body.has-bar .fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* ----- Bottom sheets (order sheet + dish detail) ----- */
.sheet{position:fixed;inset:0;background:rgba(20,14,8,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
#detail{z-index:21}
.panel{position:relative;background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(48px);opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);cursor:pointer;display:grid;place-items:center;z-index:2}
.sheet-h{display:flex;align-items:center;gap:8px;padding-right:48px;margin-bottom:8px}
.sheet-h h3{font-family:var(--font-head);font-weight:400;font-size:1.7rem;color:var(--leaf);margin:0}
.chipt{background:var(--chip);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.85rem}
.hint{color:var(--muted);margin:0 0 8px}
.card2{background:var(--bg);border-radius:var(--r);padding:16px;margin-top:16px}
.card2 h4{margin:0 0 4px;font-size:1.1rem;display:flex;justify-content:space-between;gap:8px}
.card2 h4 small{color:var(--muted);font-weight:600;font-size:.9rem}
.oline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.oline:last-child{border-bottom:0}
.oline .on{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.oline .on b{font-weight:600}.oline .on small{color:var(--muted)}
.oline .lp{font-weight:700;min-width:60px;text-align:right}
.again{min-height:44px;border:1.5px solid var(--leaf);color:var(--leaf);background:var(--surface);border-radius:10px;padding:4px 12px;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-weight:800;font-size:1.2rem}
.estimate{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.field{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted);margin:16px 0 4px;font-weight:600}
.panel input,.panel textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:1rem;resize:vertical}
.panel textarea{min-height:64px}
.pendnote{background:color-mix(in srgb,var(--turmeric) 18%,var(--surface));border:1px solid var(--turmeric);border-radius:var(--r);padding:12px;margin:8px 0;font-weight:700}
.pendnote .actions{margin-top:8px}

/* ----- Buttons ----- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;padding:12px 16px;font-weight:800;font-size:1.05rem;cursor:pointer;border:0;text-decoration:none;margin-top:12px}
.btn-wa{background:var(--wa);color:#fff}
.btn-primary{background:var(--leaf);color:var(--on-leaf)}
.btn-outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-danger{background:var(--nonveg);color:#fff}
.btn-text{display:block;width:100%;min-height:44px;background:none;border:0;color:var(--leaf);font-weight:700;font-size:.95rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:8px}
.btn-text.red{color:var(--nonveg)}
.actions{display:flex;gap:8px}
.actions .btn{margin-top:0}

/* ----- Dish detail sheet ----- */
.dimg{display:block;width:calc(100% + 40px);margin:-8px -20px 16px;aspect-ratio:4/3;max-height:52vh;object-fit:cover;background:var(--chip);border-radius:24px 24px 0 0}
.detail-body h3{font-size:1.4rem;margin:0 0 2px;line-height:1.25;padding-right:48px}
.detail-body .desc{display:block;font-size:1rem;margin-top:8px}
.dqty{display:flex;align-items:center;gap:12px;margin-top:20px}
.dqty .qty{min-width:120px;height:52px}.dqty .qty button{height:52px;width:44px}
.dqty .btn{margin:0;flex:1}
.inorder{color:var(--muted);font-size:.9rem;margin-top:8px}

/* ----- Full-screen moments: welcome, order sent, farewell ----- */
.overlay{position:fixed;inset:0;z-index:40;background:var(--surface);overflow:auto;display:flex;align-items:stretch;justify-content:center}
.moment{width:100%;min-height:100%;display:flex;flex-direction:column;background:var(--surface);text-align:center}
@media (min-width:640px){
  .overlay{background:rgba(20,14,8,.55);padding:24px;align-items:center}
  .moment{max-width:440px;min-height:0;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg)}
}
.mtop{position:relative;color:#fff;padding:40px 24px 32px;background:linear-gradient(160deg,var(--brand),color-mix(in srgb,var(--brand) 62%,#000));overflow:hidden}
.mtop .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mtop.has-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.7))}
.mtop>*:not(.cover){position:relative;z-index:1}
.mtop .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 12px;display:block}
.mtop .mname{font-family:var(--font-head);font-size:2.1rem;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.mbody{flex:1;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.mbody h2{font-size:1.45rem;line-height:1.25;margin:0 0 8px}
.mbody p{color:var(--muted);margin:0 0 8px}
.wtable{display:inline-block;align-self:center;background:var(--turmeric);color:#2A2118;font-weight:800;border-radius:999px;padding:4px 16px;margin:4px 0 8px}
.steps{list-style:none;padding:0;margin:16px 0 8px;display:grid;gap:8px;text-align:left}
.steps li{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:12px;font-weight:600}
.steps .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--leaf) 14%,var(--surface));color:var(--leaf);flex:none}
.steps .n{font-weight:800;color:var(--leaf);margin-right:6px}
.mbody .grow{flex:1;min-height:8px}
.check{width:88px;height:88px;margin:8px auto 16px;display:block}
.check circle{fill:none;stroke:var(--veg);stroke-width:3;stroke-dasharray:152;stroke-dashoffset:152;animation:draw .6s ease-out forwards}
.check path{fill:none;stroke:var(--veg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.csum{background:var(--bg);border-radius:var(--r);padding:4px 16px 8px;margin:16px 0 8px;text-align:left}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:41}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall 2.6s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(540deg)}}
.social{display:flex;justify-content:center;gap:16px;margin-top:8px}
.social a{color:var(--leaf);font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:44px}

/* ----- Pop-up dialog + toast ----- */
.modal{position:fixed;inset:0;background:rgba(20,14,8,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:45}
.box{background:var(--surface);color:var(--ink);border-radius:20px;padding:24px 20px 20px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);animation:up .22s ease-out}
.box h3{margin:0 0 8px;font-size:1.3rem;line-height:1.3}
.box p{margin:0 0 16px;color:var(--muted)}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;text-align:center;font-weight:600;z-index:50;box-shadow:var(--shadow-lg);animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}

@media (min-width:720px){
  .media,.media img{width:132px}.media img{height:132px}
  .dish.noimg .media{width:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .check circle,.check path{stroke-dashoffset:0}
  .confetti{display:none}
}
</style>
</head>
<body>
<!--
  MenuScan - one page serves every restaurant.
  URL format:  index.html?r=<restaurant-id>&table=<table-number>
  Example:     index.html?r=kesar-rasoi&table=7
  The restaurant's menu is loaded from  menus/<restaurant-id>.js
-->

const LINE = "━━━━━━━━━━━━━━━";

// One order round. o = { restaurant, table, round, name, lines:[{qty,name,total}], subtotal, tableTotal, note }
function buildOrderMessage(o){
  const first = o.round === 1;
  const where = o.table ? "📍 *Table " + o.table + "*" : "📍 Table: not specified";
  return [
    (first ? "🍽️ *NEW ORDER — " : "➕ *ADDITIONAL ORDER — ") + o.restaurant + "*",
    where + "  ·  Round " + o.round,
    o.name ? "👤 " + o.name : null,
    LINE,
    ...o.lines.map(l => l.qty + " × " + l.name + " — " + rupee(l.total)),
    LINE,
    "*Subtotal: " + rupee(o.subtotal) + "*",
    first ? null : "Table total so far: " + rupee(o.tableTotal),
    o.note ? "📝 _Note: " + o.note + "_" : null,
    LINE,
    "Thank you! 🙏",
    "_Sent via MenuScan_"
  ].filter(x => x !== null).join("\n");
}

// Bill request. b = { restaurant, table, rounds, total }
function buildBillMessage(b){
  return [
    "🧾 *BILL REQUEST — " + b.restaurant + "*",
    b.table ? "📍 *Table " + b.table + "*" : "📍 Table: not specified",
    "Rounds ordered: " + b.rounds,
    "*Estimated total: " + rupee(b.total) + "*",
    "Thank you for a wonderful meal! 🙏",
    "_Sent via MenuScan_"
  ].join("\n");
}

// Read restaurant + table from the QR link
// =====================================================================
const params = new URLSearchParams(location.search);
const slug = (params.get("r") || "kesar-rasoi").toLowerCase().replace(/[^a-z0-9-]/g, "");
const table = (params.get("table") || "").replace(/[^A-Za-z0-9-]/g, "");
const $ = id => document.getElementById(id);
const rupee = n => "₹" + n.toLocaleString("en-IN");
const now = () => Date.now();
// Make text safe to put inside HTML
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Only allow normal web links or file paths in the repo (not "javascript:" etc.)
const safeUrl = u => typeof u === "string" && (/^https?:\/\//i.test(u) || /^[\w./-]+$/.test(u)) ? u : "";
const waNumber = () => String((M && M.whatsapp) || DEFAULT_WA).replace(/\D/g, "");
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

let M = null, lang = "en", vegOnly = false, q = "";
const badImg = new Set();          // dish ids whose photo failed to load

// =====================================================================
// TABLE SESSION (saved on this phone)
// One session per restaurant, saved under "menuSession:<restaurant-id>":
//   current:  new items not sent yet        {itemId: qty}
//   rounds:   orders already sent           [{at: time, items: {itemId: qty}}]
//   pending:  a WhatsApp message we opened but the customer hasn't confirmed yet
//   welcomed: true once the welcome screen was shown for this session
// =====================================================================
const sessionKey = "menuSession:" + slug;
const oldKey = "menuList:" + slug;          // the old single list, from before rounds existed
const expired = s => now() - (s.lastActive || 0) > SESSION_HOURS * 3600000;
const newSession = () => ({ table, startedAt: now(), lastActive: now(), current: {}, rounds: [], name: "", pending: null, welcomed: false });

function loadSession(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(sessionKey)); } catch (e) {}
  // Missing or damaged → start clean
  if (!s || typeof s !== "object" || !s.current || typeof s.current !== "object" || !Array.isArray(s.rounds)) s = newSession();
  // Auto-close: nobody touched it for SESSION_HOURS
  if (expired(s)) s = newSession();
  // Auto-close: a different table with earlier orders means this is a new visit
  if ((s.table || "") !== table && s.rounds.length) s = newSession();
  s.table = table;
  // Move the old saved list (menuList:<id>) into "current", then delete the old key
  let old = null;
  try { old = JSON.parse(localStorage.getItem(oldKey)); } catch (e) {}
  if (old && typeof old === "object") for (const k in old) if (old[k] > 0) s.current[k] = (s.current[k] || 0) + old[k];
  try { localStorage.removeItem(oldKey); } catch (e) {}
  return s;
}
let S = loadSession();
const store = () => { try { localStorage.setItem(sessionKey, JSON.stringify(S)); } catch (e) {} };
const save = () => { S.lastActive = now(); store(); };   // call after every change
store();

// Small helpers for orders
// =====================================================================
const find = k => M.items.find(i => String(i.id) === String(k));
// {itemId: qty}  →  [[dish, qty], ...]  (skips dishes no longer on the menu)
const linesOf = obj => Object.keys(obj || {}).map(k => [find(k), obj[k]]).filter(([i, n]) => i && n > 0);
const sumOf = ls => ls.reduce((a, [i, n]) => a + n * i.price, 0);
const countOf = ls => ls.reduce((a, [, n]) => a + n, 0);
const sentLines = () => S.rounds.flatMap(r => linesOf(r.items));
const orderedQty = id => S.rounds.reduce((a, r) => a + ((r.items || {})[id] || 0), 0);
const nameOf = i => lang === "en" ? i.en : (i.hi || i.en);
const altOf = i => lang === "en" ? (i.hi || "") : (i.hi ? i.en : "");
const timeOf = ts => new Date(ts).toLocaleTimeString("en-IN", {hour: "numeric", minute: "2-digit"});
const tagsOf = i => (Array.isArray(i.tags) ? i.tags : i.tag ? [i.tag] : []).filter(Boolean);
const imgOf = i => badImg.has(String(i.id)) ? "" : safeUrl(i.image);
const coverOf = () => safeUrl(M.cover || (M.theme && M.theme.cover));
const logoOf = () => safeUrl((M.theme && M.theme.logo) || M.logo);

// =====================================================================
// THEME: optional  theme: { primary, primaryDark, accent, font, logo }  in the menu file
// =====================================================================
function applyTheme(th){
  if (!th || typeof th !== "object") return;
  const root = document.documentElement.style;
  const isColour = c => typeof c === "string" && /^(#[0-9a-f]{3,8}|rgb|hsl)/i.test(c.trim());
  if (isColour(th.primary)) {
    root.setProperty("--brand", th.primary);
    root.setProperty("--brand-dark", isColour(th.primaryDark) ? th.primaryDark : "color-mix(in srgb, " + th.primary + " 50%, #fff)");
    document.querySelector('meta[name="theme-color"]').content = th.primary;
  }
  if (isColour(th.accent)) root.setProperty("--accent", th.accent);
  // Heading font from Google Fonts, e.g. font: "Baloo 2"
  if (typeof th.font === "string" && /^[\w ]+$/.test(th.font)) {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + th.font.trim().replace(/ /g, "+") + "&display=swap";
    document.head.appendChild(l);
    root.setProperty("--font-head", '"' + th.font + '","Mukta",serif');
  }
}

// Put a photo into an <img>, or hide it if missing / broken (never a broken icon)
function setImg(img, src, onFail){
  img.onerror = null;
  if (!src) { img.hidden = true; img.removeAttribute("src"); if (onFail) onFail(); return; }
  img.onerror = () => { img.hidden = true; img.removeAttribute("src"); if (onFail) onFail(); };
  img.hidden = false; img.src = src;
}
// Called from a dish card photo that fails to load → switch that card to the no-photo layout
function imgFail(img, id){
  badImg.add(String(id));
  const card = img.closest(".dish"); if (card) card.classList.add("noimg");
  img.remove();
}

// The + / − control (or "ADD" / "Not available") for one dish
function ctlHtml(i, small){
  const t = T[lang], n = S.current[i.id] || 0, nm = esc(nameOf(i));
  if (!i.available) return `<span class="na">${t.na}</span>`;
  if (n) return `<div class="qty${small ? " sm" : ""}"><button type="button" data-m="${esc(i.id)}" aria-label="${t.less}: ${nm}">−</button><span>${n}</span><button type="button" data-p="${esc(i.id)}" aria-label="${t.more}: ${nm}">+</button></div>`;
  return `<button class="add" type="button" data-p="${esc(i.id)}" aria-label="${t.add}: ${nm}">${t.add}</button>`;
}
function tagHtml(i){
  const t = T[lang];
  return tagsOf(i).map(g => `<span class="tag ${esc(g)}">${esc(t[g] || g)}</span>`).join("");
}

function renderMenu(){
  const t = T[lang];
  const ql = q.trim().toLowerCase();

function dishHtml(i){

// Update just one dish card after + / − (faster than redrawing the whole menu)
function updateDish(id, bounce){
  const i = find(id); if (!i) return;
  document.querySelectorAll(`[data-dish="${CSS.escape(String(id))}"] .ctl`).forEach(el => {
    el.innerHTML = ctlHtml(i);
    if (bounce && !reduceMotion()) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  });
}

// Category chips light up while scrolling (IntersectionObserver)
let observer = null;
function watchSections(){
  if (observer) observer.disconnect();
  const bar = $("toolbar").offsetHeight;
  document.documentElement.style.setProperty("--toolbarH", bar + "px");
  if (!("IntersectionObserver" in window)) return;
  const visible = new Set();
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting ? visible.add(e.target.dataset.sec) : visible.delete(e.target.dataset.sec));
    const first = [...document.querySelectorAll("section[data-sec]")].find(sec => visible.has(sec.dataset.sec));
    if (first) setActiveChip(first.dataset.sec);
  }, { rootMargin: "-" + (bar + 8) + "px 0px -60% 0px" });
  document.querySelectorAll("section[data-sec]").forEach(sec => observer.observe(sec));
}
function setActiveChip(id){
  const chips = $("chips");
  chips.querySelectorAll(".chip").forEach(c => {
    const on = c.dataset.c === id;
    if (on === c.classList.contains("on")) return;
    c.classList.toggle("on", on);
    if (on) chips.scrollTo({ left: c.offsetLeft - chips.clientWidth / 2 + c.offsetWidth / 2, behavior: reduceMotion() ? "auto" : "smooth" });
  });
}

// Bottom bar: "3 new items · ₹540 | Send order"  or  "Ordered · ₹1,240 | View my order"
function renderBar(bump){
  const t = T[lang], cur = linesOf(S.current), hasNew = cur.length > 0;
  const show = hasNew || S.rounds.length > 0;
  $("bar").hidden = !show;
  document.body.classList.toggle("has-bar", show);
  const btn = $("openList");
  if (hasNew) {
    const go = waNumber() ? `<svg class="i" aria-hidden="true"><use href="#i-wa"/></svg>${t.sendShort}` : t.view;
    btn.innerHTML = `<span class="count${bump ? " bump" : ""}">${countOf(cur)}</span><span class="bt"><b>${t.newItems(countOf(cur))}</b><small>${rupee(sumOf(cur))}</small></span><span class="go${waNumber() ? "" : " view"}">${go}</span>`;
  } else if (show) {
    btn.innerHTML = `<span class="count"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></span><span class="bt"><b>${t.ordered}</b><small>${rupee(sumOf(sentLines()))}</small></span><span class="go view">${t.view}</span>`;
  }
  if (!show) closeSheet("sheet");
}

function renderSheet(){
  const t = T[lang], cur = linesOf(S.current), hasWa = !!waNumber();
  $("sheetTitle").textContent = t.yourOrder;
  $("sTable").textContent = table ? t.table + " " + table : ""; $("sTable").hidden = !table;
  // Waiting for "did it send?" → show a reminder at the top
  $("pendNote").hidden = !S.pending;
  if (S.pending) {
    const bill = S.pending.type === "bill";
    $("pendQ").textContent = bill ? t.pendBill : t.pendOrder;
    $("pendYes").textContent = bill ? t.yes : t.yesSent; $("pendNo").textContent = bill ? t.no : t.notSent;
  }
  // New items (this round), each with its own + / −
  $("newTitle").textContent = t.newOrder + (S.rounds.length ? " · " + t.roundN(S.rounds.length + 1) : "");
  $("newCount").textContent = cur.length ? t.newItems(countOf(cur)) : "";
  $("sheetHint").textContent = cur.length ? (hasWa ? t.hintWa : t.hintWaiter) : t.noNew;
  $("lines").innerHTML = cur.map(([i, n]) => `<div class="oline"><span class="on"><b>${esc(nameOf(i))}</b><small>${t.each(rupee(i.price))}</small></span>${ctlHtml(i, true)}<span class="lp">${rupee(n * i.price)}</span></div>`).join("");
  $("newBox").hidden = !cur.length;
  $("subLbl").textContent = t.subtotal; $("newSub").textContent = rupee(sumOf(cur));
  $("nameLbl").textContent = t.name; $("noteLbl").textContent = t.note; $("note").placeholder = t.notePh;
  $("noteCount").textContent = $("note").value.length + "/200";
  $("send").hidden = !hasWa; $("sendLbl").textContent = t.send;
  $("taken").hidden = hasWa; $("taken").textContent = t.taken;          // no WhatsApp number → waiter button instead
  $("markSent").hidden = !hasWa; $("markSent").textContent = t.markSent;
  // Earlier rounds, each dish with "Add again"
  $("roundsSec").hidden = !S.rounds.length;
  $("alreadyLbl").textContent = t.already;
  $("rounds").innerHTML = S.rounds.map((r, idx) => {
    const ls = linesOf(r.items);
    return `<div class="field round"><span>${t.roundAt(idx + 1, timeOf(r.at))}</span><span>${rupee(sumOf(ls))}</span></div>` +
      ls.map(([i, n]) => `<div class="oline"><span class="on"><b>${n} × ${esc(nameOf(i))}</b><small>${rupee(n * i.price)}</small></span>` +
        (i.available ? `<button class="again" type="button" data-p="${esc(i.id)}">${t.again}</button>` : `<span class="na">${t.na}</span>`) + `</div>`).join("");
  }).join("");
  // Totals
  $("soFarLbl").textContent = t.soFar; $("soFar").textContent = rupee(sumOf(sentLines()) + sumOf(cur));
  $("estimate").textContent = t.estimate;
  // Bill + close
  $("bill").hidden = !(hasWa && S.rounds.length); $("billLbl").textContent = t.bill;
  $("clear").hidden = !cur.length; $("clear").textContent = t.clear; $("close").textContent = t.back;
  $("closeTable").textContent = t.closeTable;
}

// SHEETS, OVERLAYS, TOAST

let lastFocus = null;
function openSheet(id){
  lastFocus = document.activeElement;
  $(id).classList.add("show"); lockScroll();
  const x = $(id).querySelector(".x"); if (x) x.focus({preventScroll: true});
}
function closeSheet(id){
  if (!$(id).classList.contains("show")) return;
  $(id).classList.remove("show"); lockScroll();
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({preventScroll: true});
}
// Stop the page behind from scrolling while something is open on top
function lockScroll(){
  const open = document.querySelector(".sheet.show") || [...document.querySelectorAll(".overlay,.modal")].some(el => !el.hidden);
  document.body.classList.toggle("locked", !!open);
}
let toastTimer = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg; el.hidden = false;
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

// ----- Dish detail sheet -----

$("dMinus").addEventListener("click", () => { detailQty = Math.max(1, detailQty - 1); updateDetail(); });

// ----- Adding / removing dishes -----
function addItem(id, n, announce){
  const i = find(id); if (!i || !i.available) return;
  const before = S.current[i.id] || 0;
  S.current[i.id] = before + n; save();
  updateDish(i.id, true); renderBar(true); renderSheet();
  if (!before || announce) toast(T[lang].added(nameOf(i)));
}
function removeItem(id){
  const i = find(id); if (!i) return;
  S.current[i.id] = Math.max(0, (S.current[i.id] || 0) - 1);
  if (!S.current[i.id]) delete S.current[i.id];
  save(); updateDish(i.id, true); renderBar(); renderSheet();
}

// =====================================================================
// WHATSAPP
// =====================================================================
function openWhatsApp(msg){
  const url = "https://wa.me/" + waNumber() + "?text=" + encodeURIComponent(msg);
  const w = window.open(url, "_blank");
  if (!w) location.href = url;              // pop-up blocked → open WhatsApp in this tab instead
}

// Send only the NEW items. They move into a round after the customer says "Yes, sent".
$("send").addEventListener("click", () => {
  const cur = linesOf(S.current);
  if (!M || !cur.length) return;
  const msg = buildOrderMessage({
    restaurant: M.name, table, round: S.rounds.length + 1, name: S.name,
    lines: cur.map(([i, n]) => ({ qty: n, name: i.en, total: n * i.price })),   // English names for the staff
    subtotal: sumOf(cur), tableTotal: sumOf(sentLines()) + sumOf(cur), note: $("note").value.trim()
  });
  // Remember exactly what was in this message, in case more dishes get added before they confirm
  S.pending = { type: "order", at: now(), items: { ...S.current } }; save(); renderSheet();
  openWhatsApp(msg);
});

$("bill").addEventListener("click", () => {
  const msg = buildBillMessage({ restaurant: M.name, table, rounds: S.rounds.length, total: sumOf(sentLines()) });
  S.pending = { type: "bill", at: now() }; save(); renderSheet();
  openWhatsApp(msg);
});

// Move items into a new round (after WhatsApp was sent, or the waiter took the order)
function moveToRound(items, at){
  if (!Object.keys(items).length) return;
  S.rounds.push({ at, items: { ...items } });
  for (const k in items) { S.current[k] = (S.current[k] || 0) - items[k]; if (S.current[k] <= 0) delete S.current[k]; }
  $("note").value = "";                     // special instructions are per round
  save(); closeSheet("sheet"); render();
  showCelebrate(S.rounds.length, items);
}

// The customer answered "Yes" / "No" about the last WhatsApp message
function answerPending(yes){
  const p = S.pending; S.pending = null;
  if (yes && p && p.type === "bill") return closeTable();
  if (yes && p && p.items && Object.keys(p.items).length) return moveToRound(p.items, p.at);
  save(); render();
}

// ----- Coming back from WhatsApp -----
function onReturn(){
  if (!M || document.visibilityState !== "visible") return;
  // Phone left open for hours → start fresh
  if (expired(S)) { S = newSession(); S.welcomed = true; store(); $("modal").hidden = true; render(); return; }
  if (!S.pending || !$("modal").hidden || !$("thanks").hidden) return;
  if (now() - S.pending.at < 1000) return;     // we only just left for WhatsApp
  const t = T[lang], bill = S.pending.type === "bill";
  showModal(bill ? t.askBill : t.askOrder, bill ? t.askBillText : t.askOrderText,
            bill ? t.yes : t.yesSent, bill ? t.no : t.notSent,
            () => answerPending(true), () => answerPending(false));
}
document.addEventListener("visibilitychange", onReturn);
window.addEventListener("focus", onReturn);
window.addEventListener("pageshow", onReturn);

// ----- Pop-up dialog -----
let onYes = null, onNo = null;
function showModal(title, text, yesLbl, noLbl, yesFn, noFn, danger){
  $("mTitle").textContent = title; $("mText").textContent = text;
  $("mYes").textContent = yesLbl; $("mNo").textContent = noLbl;
  $("mYes").className = "btn " + (danger ? "btn-danger" : "btn-primary");
  onYes = yesFn; onNo = noFn;
  $("modal").hidden = false; lockScroll(); $("mYes").focus();
}
$("mYes").addEventListener("click", () => { $("modal").hidden = true; lockScroll(); if (onYes) onYes(); });
$("mNo").addEventListener("click", () => { $("modal").hidden = true; lockScroll(); if (onNo) onNo(); });

// =====================================================================
// WELCOME, ORDER SENT, FAREWELL
// =====================================================================
// Fill the coloured top part (cover photo, logo, name) of a full-screen moment
function fillTop(prefix){
  const top = $(prefix + "Top");
  top.classList.toggle("has-cover", !!coverOf());
  setImg($(prefix + "Cover"), coverOf(), () => top.classList.remove("has-cover"));
  setImg($(prefix + "Logo"), logoOf()); $(prefix + "Logo").alt = M.name;
  $(prefix + "Name").textContent = M.name;
}

function showWelcome(){
  const t = T[lang];
  fillTop("w");
  $("wTitle").textContent = (M.welcome && M.welcome[lang]) || t.hello(M.name);
  $("wTable").textContent = table ? t.youAt(table) : ""; $("wTable").hidden = !table;
  $("st1").textContent = t.step1; $("st2").textContent = t.step2;
  $("st3").textContent = waNumber() ? t.step3 : t.hintWaiter;
  $("wGo").textContent = t.viewMenu; $("wLang").textContent = t.otherLang;
  $("welcome").hidden = false; lockScroll(); $("wGo").focus();
}
$("wGo").addEventListener("click", () => { S.welcomed = true; save(); $("welcome").hidden = true; lockScroll(); });
$("wLang").addEventListener("click", () => { lang = lang === "en" ? "hi" : "en"; render(); showWelcome(); });

function showCelebrate(round, items){
  const t = T[lang], ls = linesOf(items);
  $("cTitle").textContent = t.sentTitle;
  $("cText").textContent = round === 1 ? t.sentFirst(table) : t.sentMore;
  $("cSum").innerHTML = `<div class="field"><span>${t.roundN(round)}</span><span>${rupee(sumOf(ls))}</span></div>` +
    ls.map(([i, n]) => `<div class="oline"><span class="on"><b>${n} × ${esc(nameOf(i))}</b></span><span class="lp">${rupee(n * i.price)}</span></div>`).join("");
  $("cMore").textContent = t.orderMore; $("cView").textContent = t.view;
  // Confetti in the restaurant's colours (skipped if the phone asks for reduced motion)
  const box = $("confetti"); box.innerHTML = "";
  if (!reduceMotion()) {
    const colours = ["var(--brand)", "var(--accent)", "var(--veg)", "#F2766D", "#7FB3F0"];
    for (let k = 0; k < 36; k++) {
      const c = document.createElement("i");
      c.style.left = Math.random() * 100 + "%";
      c.style.background = colours[k % colours.length];
      c.style.animationDelay = (Math.random() * 0.6) + "s";
      c.style.animationDuration = (2 + Math.random() * 1.4) + "s";
      box.appendChild(c);
    }
  }
  $("celebrate").hidden = false; lockScroll(); $("cMore").focus();
}
$("cMore").addEventListener("click", () => { $("celebrate").hidden = true; lockScroll(); });
$("cView").addEventListener("click", () => { $("celebrate").hidden = true; renderSheet(); openSheet("sheet"); });

// ----- Closing the table -----
function closeTable(){
  const t = T[lang];
  try { localStorage.removeItem(sessionKey); } catch (e) {}
  S = newSession();
  $("note").value = ""; $("cname").value = "";
  closeSheet("sheet"); $("modal").hidden = true;
  fillTop("f");
  $("thanksTitle").textContent = t.bye; $("thanksText").textContent = t.byeText;
  // Optional review + Instagram links from the menu file
  const review = /^https?:\/\//i.test(M.reviewUrl || "") ? M.reviewUrl : "";
  $("review").hidden = !review; if (review) $("review").href = review;
  $("reviewLbl").textContent = t.rate;
  const ig = typeof M.instagram === "string" ? M.instagram.trim() : "";
  const igUrl = /^https?:\/\//i.test(ig) ? ig : /^@?[\w.]+$/.test(ig) ? "https://instagram.com/" + ig.replace(/^@/, "") : "";
  $("insta").hidden = !igUrl; if (igUrl) $("insta").href = igUrl;
  $("instaLbl").textContent = t.insta;
  $("startNew").textContent = t.startNew;
  $("thanks").hidden = false; lockScroll();
  render();
  $("startNew").focus();
}
$("closeTable").addEventListener("click", () => {
  const t = T[lang];
  showModal(t.closeQ, t.closeText, t.closeYes, t.cancel, closeTable, null, true);
});
$("startNew").addEventListener("click", () => {
  S.welcomed = true; save();                 // they've just seen us – skip the welcome screen
  $("thanks").hidden = true; lockScroll(); window.scrollTo(0, 0);
});

// =====================================================================
// BUTTONS
// =====================================================================
document.addEventListener("click", e => {
  if (!M) return;
  const el = e.target;
  const p = el.closest("[data-p]"), m = el.closest("[data-m]"), c = el.closest("[data-c]"), more = el.closest("[data-more]");
  if (p) return addItem(p.dataset.p, 1, !!el.closest("#rounds"));
  if (m) return removeItem(m.dataset.m);
  if (c) {
    setActiveChip(c.dataset.c);
    const sec = $("s-" + c.dataset.c);
    if (sec) sec.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth" });
    return;
  }
  // Tap a long description to expand / collapse it
  if (more && (more.classList.contains("open") || more.scrollHeight > more.clientHeight + 2)) { more.classList.toggle("open"); return; }
  // Tapping a dish card (not its buttons) opens the detail sheet
  const card = el.closest(".dish");
  if (card && !el.closest(".ctl")) openDetail(card.dataset.dish);
});
$("q").addEventListener("input", e => { q = e.target.value; if (M) renderMenu(); });
$("veg").addEventListener("click", () => { vegOnly = !vegOnly; $("veg").setAttribute("aria-checked", vegOnly); if (M) renderMenu(); });
$("lang").addEventListener("click", () => { lang = lang === "en" ? "hi" : "en"; if (M) render(); });
$("openList").addEventListener("click", () => { renderSheet(); openSheet("sheet"); });
$("close").addEventListener("click", () => closeSheet("sheet"));
$("sClose").addEventListener("click", () => closeSheet("sheet"));
["sheet", "detail"].forEach(id => $(id).addEventListener("click", e => { if (e.target === $(id)) closeSheet(id); }));
$("cname").addEventListener("input", e => { S.name = e.target.value.trim(); save(); });
$("note").addEventListener("input", () => { $("noteCount").textContent = $("note").value.length + "/200"; });
$("pendYes").addEventListener("click", () => answerPending(true));
$("pendNo").addEventListener("click", () => answerPending(false));
$("taken").addEventListener("click", () => moveToRound({ ...S.current }, now()));
$("markSent").addEventListener("click", () => moveToRound({ ...S.current }, now()));
$("clear").addEventListener("click", () => { S.current = {}; save(); if (!S.rounds.length) closeSheet("sheet"); render(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("modal").hidden) { $("modal").hidden = true; lockScroll(); return; }
  if ($("detail").classList.contains("show")) return closeSheet("detail");
  closeSheet("sheet");
});
window.addEventListener("resize", () => { if (M) watchSections(); });
</script>
</body>
</html>
